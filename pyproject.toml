[project]
name = "wisdom-engine"
version = "0.2.0"
description = "Revisable inquiry records and optional Jev evidence assessments over MCP"
requires-python = ">=3.12"
dependencies = [
    "mcp==1.27.2",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
wisdom-engine = "wisdom_engine.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wisdom_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "/.agents/skills",
    "/src",
    "/tests",
    "/scripts",
    "/docs",
    "/evals/*.py",
    "/evals/cases.json",
    "/evals/gold.json",
    "/evals/PROTOCOL.md",
    "/evals/REVISION_PROTOCOL.md",
    "/evals/results/*.json",
    "/README.md",
    "/PLAN.md",
    "/pyproject.toml",
    "/uv.lock",
    "/mcp_config_example.json",
    "/.env.example",
]
exclude = ["__pycache__", "*.pyc"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
